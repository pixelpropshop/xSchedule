name: macOS Build

on:
  push:
    branches: [ feature/macos ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # the dependency bundle's static libraries hold Xcode 26 bitcode, which an older linker can't read
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Xcode
        run: xcodebuild -version

      - name: Dependency bundle
        working-directory: xlights/macOS
        run: |
          bash scripts/download_deps
          lipo -info dependencies/lib/libwx_baseu-3.3.a dependencies/lib/libavcodec.a

      - name: Icon
        run: |
          mkdir -p build/xSchedule.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s images/icons/256x256.png --out build/xSchedule.iconset/icon_${s}x${s}.png > /dev/null
            d=$((s * 2))
            sips -z $d $d images/icons/256x256.png --out build/xSchedule.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns build/xSchedule.iconset -o build/xSchedule.icns

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          # -k keeps going past an error, so one run shows all of them
          cmake --build build -j $(sysctl -n hw.ncpu) -- -k 2>&1 | tee build/build.log | grep -E " error: |Linking|Built target" || true
          test -x build/xSchedule.app/Contents/MacOS/xSchedule

      - name: Errors
        if: failure()
        run: |
          grep -E " error: " build/build.log | sort | uniq -c | sort -rn | head -80
          # the linker's missing symbols, by name
          grep -E "^ld: |Undefined symbols|^  \"" build/build.log | sed 's/, referenced from:.*//' | sort -u | head -200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build/build.log

      - name: Package
        run: |
          codesign --force --deep --sign - build/xSchedule.app
          otool -L build/xSchedule.app/Contents/MacOS/xSchedule
          mkdir -p dmg
          cp -R build/xSchedule.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "xSchedule" -srcfolder dmg -ov -format UDZO xSchedule-macOS.dmg

      - name: Smoke test
        run: |
          mkdir -p ~/smoke && cp build_scripts/macos/smoke/* ~/smoke/
          build/xSchedule.app/Contents/MacOS/xSchedule -s ~/smoke > smoke-app.txt 2>&1 &
          APP=$!
          up=0
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:8099/xScheduleQuery?Query=GetPlayingStatus" > /dev/null; then up=1; break; fi
            sleep 1
          done
          echo "web server up: $up after $i s"
          curl -sf "http://127.0.0.1:8099/xScheduleCommand?Command=Play%20specified%20playlist&Parameters=Test"; echo
          sleep 4
          curl -sf "http://127.0.0.1:8099/xScheduleQuery?Query=GetPlayingStatus" | head -c 400; echo
          curl -sf "http://127.0.0.1:8099/xScheduleQuery?Query=GetCalendar&Parameters=2026-12-22,2026-12-24" | head -c 600; echo
          echo "web page: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/xScheduleWeb/index.html)"
          screencapture -x smoke.png || true
          kill $APP || true
          sleep 2
          cp ~/Library/Logs/xschedule_spdlog.log smoke-log.txt || true
          tail -40 smoke-log.txt || true
          test $up = 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.png
            smoke-log.txt
            smoke-app.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: xSchedule-macOS.dmg
